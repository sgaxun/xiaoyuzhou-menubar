name: Native build validation
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm test
      - name: Create disposable update signing key
        run: |
          node --input-type=module <<'JS'
          import {generateKeyPairSync} from 'node:crypto';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const {privateKey,publicKey}=generateKeyPairSync('ed25519');
          const pub=publicKey.export({format:'der',type:'spki'}).subarray(-32);
          const seed=privateKey.export({format:'der',type:'pkcs8'}).subarray(-32);
          const c=JSON.parse(readFileSync('mygo.json','utf8'));
          c.updates.publicKey=pub.toString('base64');
          c.updates.github=process.env.GITHUB_REPOSITORY;
          writeFileSync('mygo.json',JSON.stringify(c));
          writeFileSync(join(process.env.RUNNER_TEMP,'mygo-test.key'),Buffer.concat([seed,pub]).toString('base64'));
          JS
      - name: Build native installer and verify signed update archive
        env:
          MYGO_UPDATER_PRIVATE_KEY_FILE: ${{ runner.temp }}/mygo-test.key
        # GitHub default GITHUB_* variables cannot be overridden via step env.
        # Remove tag-only publishing guards only in this no-upload validation child.
        run: env -u GITHUB_ACTIONS -u GITHUB_REF_TYPE npm run release
      - name: Inspect Windows executable, installer and update contents
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $c = Get-Content mygo.json | ConvertFrom-Json
          $dir = 'build/windows-amd64'
          $exe = Join-Path $dir ($c.name + '.exe')
          if (!(Test-Path $exe)) { throw "Missing application executable: $exe" }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Not a PE executable' }
          $archive = "release/$($c.slug)-$($c.version)-windows-amd64.tar.gz"
          & go run ./scripts/checkarchive $archive $dir ($c.name + '.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract and verify update archive' }
          $setup = Resolve-Path "release/$($c.slug)-setup-$($c.version)-amd64.exe"
          # NSIS silent install creates per-user files and does not launch the app.
          $dest = Join-Path $env:RUNNER_TEMP 'xiaoyuzhou-install'
          $p = Start-Process -FilePath $setup -ArgumentList @('/S',"/D=$dest") -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path (Join-Path $dest ($c.name + '.exe')))) { throw 'Silent installation failed' }
      - name: Smoke installed Windows app (bridge, audio and image clipboard)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $c = Get-Content mygo.json | ConvertFrom-Json
          $exe = Join-Path $env:RUNNER_TEMP "xiaoyuzhou-install/$($c.name).exe"
          $env:XIAOYUZHOU_MENUBAR_DATA_DIR = Join-Path $env:RUNNER_TEMP 'xiaoyuzhou-smoke-data'
          $env:XIAOYUZHOU_NATIVE_SMOKE_RESULT = Join-Path $env:RUNNER_TEMP 'xiaoyuzhou-smoke-result.json'
          New-Item -ItemType Directory -Force $env:XIAOYUZHOU_MENUBAR_DATA_DIR | Out-Null
          Remove-Item $env:XIAOYUZHOU_NATIVE_SMOKE_RESULT -Force -ErrorAction SilentlyContinue
          $app = $null
          try {
            $app = Start-Process -FilePath $exe -PassThru
            $deadline = [DateTime]::UtcNow.AddSeconds(90)
            while (!(Test-Path $env:XIAOYUZHOU_NATIVE_SMOKE_RESULT)) {
              if ([DateTime]::UtcNow -ge $deadline) { throw 'Native smoke result timed out after 90 seconds' }
              $app.Refresh()
              if ($app.HasExited) { throw "App exited before smoke result (exit $($app.ExitCode))" }
              Start-Sleep -Milliseconds 500
            }
            $result = Get-Content -Raw $env:XIAOYUZHOU_NATIVE_SMOKE_RESULT | ConvertFrom-Json
            if ($result.ok -isnot [bool] -or $result.ok -ne $true) { throw "Native smoke failed: $($result.error)" }
            Write-Host 'Native bridge, audio playback and image clipboard smoke passed'
          } finally {
            if ($null -ne $app) {
              $app.Refresh()
              if (!$app.HasExited) { & taskkill /PID $app.Id /T /F | Out-Null }
            }
            Remove-Item Env:XIAOYUZHOU_NATIVE_SMOKE_RESULT -ErrorAction SilentlyContinue
            Remove-Item Env:XIAOYUZHOU_MENUBAR_DATA_DIR -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-native-smoke-result
          if-no-files-found: ignore
          path: ${{ runner.temp }}/xiaoyuzhou-smoke-result.json
        # Retain failure details even if the smoke step fails.
        # The step is Windows-only because there is no result on macOS.
      - name: Build distributable Windows installer with production update public key
        if: runner.os == 'Windows'
        run: |
          git restore mygo.json
          npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: validation-${{ runner.os }}
          if-no-files-found: error
          path: release/*
      - name: Remove disposable signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/mygo-test.key"
