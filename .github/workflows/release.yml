name: Draft release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    strategy:
      fail-fast: false
      max-parallel: 1 # Both platforms reuse one draft; avoid concurrent creation.
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            target: darwin-arm64
          - os: windows-latest
            arch: x64
            target: windows-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check target repository, version tag and architecture
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const c = JSON.parse(readFileSync('mygo.json', 'utf8'));
          const p = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.arch !== process.env.EXPECTED_ARCH) throw Error('runner architecture mismatch');
          if (c.updates?.github?.toLowerCase() !== process.env.EXPECTED_REPOSITORY.toLowerCase()) throw Error('updates.github repository mismatch');
          if (process.env.GITHUB_REF_TYPE !== 'tag' || process.env.GITHUB_REF_NAME !== `v${c.version}` || p.version !== c.version) throw Error('Select/push the matching version tag');
          if (!p.scripts?.release) throw Error('package.json requires scripts.release = node scripts/release.mjs');
          JS
      - run: npm ci
      - run: npm test
      - name: Build signed updates and upload draft only
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: npm run release -- --draft
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-release
          if-no-files-found: error
          path: |
            release/*
